# SENTINEL — one-command startup:  docker compose up --build
# Dashboard: http://localhost:5173   API docs: http://localhost:8000/docs
services:
  backend:
    build:
      context: ./backend
      args:
        # true bakes torch/transformers into the image so NLP_MODE=full works
        # in Docker (image grows ~2 GB); false falls back to the lite engine.
        INSTALL_ML: ${INSTALL_ML:-false}
    ports:
      - "8000:8000"
    environment:
      # demo defaults; add real keys here or via backend/.env
      NLP_MODE: ${NLP_MODE:-full}
      SIMULATION_ENABLED: ${SIMULATION_ENABLED:-true}
      TARGET_CITIES: ${TARGET_CITIES:-Surat,Ahmedabad,Vadodara,Rajkot}
      CRAWL_MIN_INTERVAL_SECONDS: ${CRAWL_MIN_INTERVAL_SECONDS:-300}
      FB_ACCESS_TOKEN: ${FB_ACCESS_TOKEN:-}
      FB_PAGE_IDS: ${FB_PAGE_IDS:-}
      IG_ACCESS_TOKEN: ${IG_ACCESS_TOKEN:-}
      IG_BUSINESS_ACCOUNT_ID: ${IG_BUSINESS_ACCOUNT_ID:-}
      IG_SEED_USERNAMES: ${IG_SEED_USERNAMES:-}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      REDDIT_SUBREDDITS: ${REDDIT_SUBREDDITS:-}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      RSS_FEEDS: ${RSS_FEEDS:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 12

  frontend:
    build:
      context: ./frontend
      args:
        # the BROWSER calls the backend, so this stays localhost even in compose
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
